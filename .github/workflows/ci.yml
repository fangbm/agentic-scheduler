name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android build SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Build dogfood app artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew :apps:android:assembleDebug :apps:desktop:createDistributable --no-daemon

      - name: Upload Android dogfood APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: agentic-scheduler-android-debug
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux Desktop dogfood app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: agentic-scheduler-desktop-linux
          path: apps/desktop/build/compose/binaries/main/app/**
          if-no-files-found: error
          retention-days: 14

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android build SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Verify Windows DPAPI secure store
        run: .\gradlew.bat :shared:application:desktopTest --tests "*DesktopPlatformSecureStoreTest" --no-daemon
      - name: Build Windows Desktop dogfood app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: .\gradlew.bat :apps:desktop:createDistributable --no-daemon
      - name: Upload Windows Desktop dogfood app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: agentic-scheduler-desktop-windows
          path: apps/desktop/build/compose/binaries/main/app/**
          if-no-files-found: error
          retention-days: 14

  linux-secret-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android build SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Install Secret Service test runtime
        run: sudo apt-get update && sudo apt-get install --yes libsecret-tools gnome-keyring dbus-x11
      - name: Verify Linux Secret Service secure store
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            export AGENTIC_SCHEDULER_SECRET_SERVICE_INTEGRATION=1
            eval "$(gnome-keyring-daemon --start --components=secrets)"
            ./gradlew :shared:application:desktopTest --tests "*LinuxSecretServiceSecureStoreIntegrationTest" --no-daemon
          '

  android-keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android build SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android Keystore secure store
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :apps:android:connectedDebugAndroidTest --no-daemon --stacktrace
