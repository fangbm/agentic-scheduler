name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Build and test
        run: ./gradlew build --no-daemon

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Build Linux desktop distribution
        run: ./gradlew :apps:desktop:createDistributable --no-daemon

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Build Windows desktop distribution
        run: .\gradlew.bat :apps:desktop:createDistributable --no-daemon
