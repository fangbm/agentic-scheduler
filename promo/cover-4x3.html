<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1600,initial-scale=1" />
  <title>Temvio — 4:3 Agent planning cover</title>
  <style>
    :root{font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:#102f55;font-synthesis:none}
    *{box-sizing:border-box}html,body{margin:0;width:1600px;height:1200px;overflow:hidden;background:#fff}#cover{position:relative;width:1600px;height:1200px;overflow:hidden;background:linear-gradient(112deg,#fff 0%,#fff 56%,#f4fbff 100%)}
    .glow{position:absolute;width:760px;height:760px;right:-28px;top:220px;border-radius:50%;background:radial-gradient(circle,rgba(16,183,194,.13),rgba(32,126,239,.055) 46%,transparent 72%)}
    .header{position:absolute;left:112px;top:70px;display:flex;align-items:center;gap:12px}.header img:first-child{width:45px;height:45px;object-fit:contain}.header img:last-child{width:126px;height:auto}
    .eyebrow{position:absolute;left:116px;top:254px;color:#1479d8;font-size:14px;font-weight:750;letter-spacing:.16em}.title{position:absolute;left:108px;top:308px;margin:0;width:655px;font-size:57px;line-height:1.25;letter-spacing:0;font-weight:760;color:#102f55}.title span{display:block}.title .accent{background:linear-gradient(95deg,#1268e8,#10b7c2);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{position:absolute;left:116px;top:485px;color:#617789;font-size:20px;line-height:1.6}.rule{position:absolute;left:116px;top:568px;width:82px;height:4px;border-radius:4px;background:linear-gradient(90deg,#1268e8,#10b7c2)}
    .brand-lockup{position:absolute;left:116px;bottom:78px;display:flex;align-items:center;gap:10px}.brand-lockup img:first-child{width:32px;height:32px}.brand-lockup img:last-child{width:94px;height:auto}.brand-note{position:absolute;left:254px;bottom:87px;color:#91a0aa;font-size:12px;letter-spacing:.04em}
    .assistant-card{position:absolute;right:65px;top:300px;width:845px;height:570px;border:1px solid #e1eaf0;border-radius:24px;background:rgba(255,255,255,.94);box-shadow:0 32px 86px rgba(34,83,124,.13);padding:25px 27px}.card-head{height:48px;display:flex;align-items:center;border-bottom:1px solid #edf1f4;padding-bottom:16px;color:#42586a;font-size:17px;font-weight:720}.agent-dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#1268e8,#10b7c2);box-shadow:0 0 0 5px #edf8fc;margin-right:12px}.card-label{margin-left:auto;color:#97a5ae;font-size:10px;letter-spacing:.06em}.prompt{margin:22px 0 16px 40px;border-radius:13px 13px 4px 13px;background:#eef6ff;color:#31536e;padding:14px 16px;font-size:15px;line-height:1.55}.reply{display:flex;align-items:flex-start;gap:12px;color:#405668;font-size:14px;line-height:1.55}.reply-mark{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:linear-gradient(145deg,#e7f2ff,#e6fbf8);display:grid;place-items:center;color:#167bd8;font-size:15px;font-weight:800}.reply small{display:block;margin-top:6px;color:#85939c;font-size:11px}.plan{margin:21px 0 0 40px;padding:15px 16px;border:1px solid #d9ebe5;border-radius:12px;background:#f5fbf8}.plan-head{display:flex;align-items:center;color:#34584e;font-size:13px;font-weight:730}.check{margin-left:auto;color:#17866e;font-size:11px}.plan-row{display:flex;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid #e3efea;color:#566f67;font-size:12px}.plan-row b{margin-left:auto;color:#1d604f;font-size:11px}.confirm{position:absolute;right:26px;bottom:22px;height:39px;padding:0 16px;border-radius:8px;display:flex;align-items:center;color:white;background:linear-gradient(100deg,#176fe2,#118fba);font-size:12px;font-weight:730;box-shadow:0 8px 18px rgba(25,117,198,.2)}
    .footline{position:absolute;right:82px;bottom:96px;color:#91a0aa;font-size:11px;letter-spacing:.12em}
  </style>
</head>
<body>
  <main id="cover">
    <div class="glow"></div>
    <div class="header"><img src="assets/temvio-icon-transparent.png" alt=""/><img src="assets/temvio-wordmark-transparent.png" alt="Temvio"/></div>
    <div class="eyebrow">AGENTIC SURFACE · DETERMINISTIC CORE</div>
    <h1 class="title"><span>把计划交给 Agent。</span><span class="accent">把决定，留给自己。</span></h1>
    <div class="sub">从一句话，到一份可检查、可确认的计划。</div>
    <div class="rule"></div>
    <div class="brand-lockup"><img src="assets/temvio-icon-transparent.png" alt=""/><img src="assets/temvio-wordmark-transparent.png" alt="Temvio"/></div>
    <div class="brand-note">时间规划，由你掌握。</div>
    <section class="assistant-card" aria-label="Agent planning preview">
      <div class="card-head"><i class="agent-dot"></i>Temvio Agent<span class="card-label">TODAY · PLAN PREVIEW</span></div>
      <div class="prompt">帮我创建“整理访谈记录”，低优先级、预计 45 分钟；再放进今天的空档。</div>
      <div class="reply"><i class="reply-mark">✦</i><div>我找到一个合适的空档，先给你看安排。<small>会先生成可检查的预览，不会直接改动日历。</small></div></div>
      <div class="plan"><div class="plan-head">计划提案 <span class="check">✓ 无冲突</span></div><div class="plan-row"><span>整理访谈记录</span><b>15:00 – 15:45</b></div><div class="plan-row"><span>权限与当前状态</span><b>等待你的确认</b></div></div>
      <div class="confirm">确认并应用</div>
    </section>
    <div class="footline">YOUR TIME. YOUR DECISION.</div>
  </main>
  <script>window.renderAt=()=>{};window.renderAt(0)</script>
</body>
</html>
